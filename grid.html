<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
</head>
<body>
    <div style="
    display: grid;
    grid-template-columns:100px 1fr;
    ">
        <div style= "background-color:blue;"> 100px </div>
        <div style= "background-color:yellow;"> 1fr </div>
    </div>
</body>
</html>
